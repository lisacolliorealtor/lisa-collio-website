# Netlify configuration — lisacolliorealtor.com
# Static site, self-hosted everything: no third-party scripts, fonts, or embeds
# (the approved Privacy Policy promises no client-side tracking).

[build]
  publish = "."

# Community pages renamed July 2026 (Batch 2f): permanent redirects from the
# old /communities/ paths. These must stay ABOVE the /* 404 rule (first match wins).
[[redirects]]
  from = "/blog/buyers/what-makes-goshen-indiana-desirable-place-to-live/"
  to = "/blog/buyers/is-goshen-indiana-good-place-to-buy-home/"
  status = 301

[[redirects]]
  from = "/communities/goshen/"
  to = "/living-in-goshen/"
  status = 301

[[redirects]]
  from = "/communities/elkhart/"
  to = "/living-in-elkhart/"
  status = 301

# Spanish Goshen community page renamed July 2026 (Batch 2e), same pattern.
[[redirects]]
  from = "/es/comunidades/goshen/"
  to = "/es/viviendo-en-goshen/"
  status = 301

# Spanish Elkhart community page renamed July 2026 (Elkhart pair), same pattern.
[[redirects]]
  from = "/es/comunidades/elkhart/"
  to = "/es/viviendo-en-elkhart/"
  status = 301

# Elkhart authority articles superseded July 2026 by the approved article sets:
# the single-district school article is replaced by the three-district version,
# and "landmarks & attractions" is replaced by "landmarks & amenities".
[[redirects]]
  from = "/blog/community/elkhart-indiana-school-district/"
  to = "/blog/community/elkhart-indiana-school-districts/"
  status = 301

[[redirects]]
  from = "/blog/community/elkhart-indiana-landmarks-attractions/"
  to = "/blog/community/elkhart-indiana-landmarks-amenities/"
  status = 301

# Custom 404 (bilingual wayfinding page).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Self-hosted everything: no external script/style/font/img/connect sources.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

# Asset caching. DURABLE FIX SHIPPED 17 August 2026 (content-hashed filenames,
# tracked in the punch list since PR #71): CSS, images, and the root favicon /
# apple-touch-icon files now carry a ?v=<content-hash> query string on every
# reference (hash-assets.js — see that file for the full mechanism and why a
# query string was chosen over renaming the physical file). The browser cache
# key includes the query string, so a changed file is a genuinely different
# URL — `immutable` is now correct and safe: a returning visitor with a stale
# URL cached simply never requests the new one; they request the NEW URL fresh
# on the next page load because the HTML referencing it changed. There is no
# window where a corrected asset can still read as the old one.
#
# The previous version of this rule (kept here as the historical record of
# why the interim fix looked the way it did) used
#   for = "/assets/css/*"     -> "public, max-age=3600, must-revalidate"
#   for = "/assets/images/*"  -> "public, max-age=86400, must-revalidate"
# specifically BECAUSE nothing was content-addressed yet: a corrected image or
# CSS fix could not reach a returning visitor until the short max-age expired.
# Found 27 July 2026 (deploy-preview-71: cleaned featured images kept serving
# their old bytes under unchanged filenames) — revalidation was cheap in the
# interim (Netlify serves ETags, so an unchanged asset cost a 304, not a
# re-download) but was never the durable answer, only the bridge to this.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Root favicon / apple-touch-icon files are hashed too (part of the same
# href/src reference pattern hash-assets.js covers) — now immutable like CSS
# and images. These previously fell through to the security-headers-only "/*"
# rule above with no explicit Cache-Control of their own.
[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts genuinely do not change in practice, but they are DELIBERATELY not
# hashed (Report-Before-Build Phase 0 recon, 17 August 2026: fonts are
# referenced only from @font-face url() inside CSS and from <link rel=preload>
# in HTML — outside the five reference patterns that PR scoped, and the
# existing max-age here already bounds a replacement to a week). If fonts are
# ever brought into the hashing pipeline, this can become immutable too.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Standard caching for HTML (always revalidate so content updates land immediately).
# HTML itself is never hashed — it's the entry point that CARRIES the hashed
# references, so it must always be fetched fresh for those references to be seen.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
